[package]
name = "intellicord"
version = "0.1.0"
edition = "2024"
description = "Opt-in Discord enhancements with Callmon voice-call history"

[dependencies]
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "io-util", "net"] }
tokio-tungstenite = "0.28"
